; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_port =  192.168.2.10
upload_protocol = espota
#upload_port = /dev/ttyUSB0
#upload_protocol = esptool

; Native Environment fuer Unit-Tests ohne ESP-Hardware
; (nur fuer Logik, die nicht von Arduino-APIs abhaengt, z.B. include/ferraris_calc.h)
[env:native]
platform = native

; Environment fuer die Wokwi-Simulation.
; Wokwi unterstuetzt ESP8266 nicht als programmierbaren Chip (der "esp-01"-Part
; in Wokwi ist nur ein WiFi-Peripherie-Modul mit fest eingebauter AT-Firmware,
; nicht in der Lage eigene Firmware auszufuehren). Daher wird fuer die
; Simulation ein ESP32-DevKit verwendet und ein Build-Flag gesetzt, das
; main.cpp auf die dafuer in diagram.json verdrahteten Pins umschalten laesst.
[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -D WOKWI_SIM
