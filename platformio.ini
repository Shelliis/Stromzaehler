; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_port =  COM[3] ; 192.168.2.10
#upload_port =  192.168.2.10
#upload_protocol = espota

; Native Environment fuer Unit-Tests ohne ESP-Hardware
; (nur fuer Logik, die nicht von Arduino-APIs abhaengt, z.B. include/ferraris_calc.h)
[env:native]
platform = native

; Environment fuer die Wokwi-Simulation.
; Wokwi simuliert nur das ESP-01-Modul (esp12e/NodeMCU-Boards werden nicht
; simuliert), daher hier ein 1MB-Flash-Board passend zum "esp-01"-Chip in
; Wokwi und ein Build-Flag, das main.cpp auf die dort verfuegbaren Pins
; (GPIO0/GPIO2) umschalten laesst.
[env:wokwi]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = -D WOKWI_SIM
